version: '3.9'
services:
  api:
    build:
      context: ../backend
    env_file:
      - ../.env.example
    ports:
      - "8000:8000"
    restart: unless-stopped

  admin-web:
    image: nginx:1.27-alpine
    volumes:
      - ../admin-web:/usr/share/nginx/html:ro
    restart: unless-stopped

  user-app:
    image: nginx:1.27-alpine
    volumes:
      - ../user-app:/usr/share/nginx/html:ro
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - admin-web
      - user-app
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped
